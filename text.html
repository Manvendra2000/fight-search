<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Flight Search</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 16px; margin: 10px; max-width: 300px; font-family: sans-serif; }
    .card img { width: 50px; }
    .btn-book { background: #01b39f; color: white; padding: 10px; border: none; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h2>Available Flights</h2>
  <div id="flightCards"></div>

  <script>
    async function loadFlights() {
      const queryUrl = localStorage.getItem("flightQuery");
      const response = await fetch(queryUrl);
      const flights = await response.json();
      const container = document.getElementById('flightCards');
    
      flights.forEach(flight => {
        const card = document.createElement('div');
        card.innerHTML = `
          <div class="row g-0 mb-3 pb-2 border rounded shadow-sm">
            <div class="col-md-8 p-3">
              <h6 class="text-muted mb-2">Outbound</h6>
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h5 class="fw-bold mb-0">${flight.dep}</h5>
                  <small class="text-warning fw-semibold">${flight.from}</small>
                </div>
                <div class="text-center">
                  <span class="badge bg-light text-dark border mb-1">${flight.duration}</span>
                  <img src="images/flights/${flight.airlineCode}.png" width="32" alt="${flight.airline}">
                  <div class="small text-muted">Direct</div>
                </div>
                <div>
                  <h5 class="fw-bold mb-0">${flight.arr}</h5>
                  <small class="text-muted">${flight.to}</small>
                </div>
              </div>
              <hr>
              <h6 class="text-muted mb-2">Inbound</h6>
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <h5 class="fw-bold mb-0">${flight.inbound_dep || 'N/A'}</h5>
                  <small class="text-muted">${flight.inbound_from || 'N/A'}</small>
                </div>
                <div class="text-center">
                  <span class="badge bg-light text-dark border mb-1">${flight.inbound_duration || 'N/A'}</span>
                  <img src="images/flights/${flight.inbound_airlineCode || flight.airlineCode}.png" width="32" alt="${flight.inbound_airline || flight.airline}">
                  <a href="#" class="text-decoration-none small text-primary">${flight.inbound_stops || 'Direct'}</a>
                </div>
                <div>
                  <h5 class="fw-bold mb-0">${flight.inbound_arr || 'N/A'}</h5>
                  <small class="text-warning fw-semibold">${flight.inbound_to || 'N/A'} <i class="bi bi-exclamation-circle"></i></small>
                </div>
              </div>
              <hr>
              <div class="d-flex align-items-center gap-3">
                <div><i class="bi bi-suitcase"></i> 1</div>
                <div><i class="bi bi-people"></i> 0</div>
                <div><i class="bi bi-trash"></i> 0</div>
                <div class="ms-auto">
                  <span class="badge bg-light text-dark border"><i class="bi bi-star-fill text-dark me-1"></i> Self-transfer hack</span>
                </div>
              </div>
            </div>
            <div class="col-md-4 d-flex flex-column justify-content-center align-items-center p-3 border-start">
              <h4 class="fw-bold mb-3">${flight.price}</h4>
              <button class="btn text-white w-100" style="background-color:#01b39f">Select</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
    // loadFlights();
    </script>
</body>
</html>
